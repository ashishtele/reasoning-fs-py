[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reasoning-fs"
version = "0.1.0"
description = "Memory-aware agent harness combining ReasoningBank and ChromaFs patterns"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Ashish Tele", email = "agent.tele92@gmail.com"}
]
keywords = [
    "ai",
    "agents",
    "memory",
    "chromadb",
    "langchain",
    "reasoning",
    "vfs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "chromadb>=0.4.0",
    "litellm>=1.20.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "langchain-core>=0.1.0",
]
langchain = [
    "langchain-core>=0.1.0",
    "langchain>=0.1.0",
]

[project.scripts]
reasoning-fs = "reasoning_fs.cli:app"

[project.urls]
Homepage = "https://github.com/ashishtele/reasoning-fs"
Documentation = "https://github.com/ashishtele/reasoning-fs#readme"
Repository = "https://github.com/ashishtele/reasoning-fs.git"
"Bug Tracker" = "https://github.com/ashishtele/reasoning-fs/issues"

[tool.hatch.build.targets.wheel]
packages = ["reasoning_fs"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=reasoning_fs --cov-report=term-missing"

[tool.coverage.run]
source = ["reasoning_fs"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
